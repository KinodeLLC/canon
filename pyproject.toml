[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "canon"
version = "0.1.0"
description = "core language for the kinode stack. contracts, effects that work like capabilities, definitions addressed by content hash, plus the runtime, verifier, journal, atlas, cli and agent interface."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Brent Gordon" }]
keywords = ["programming-language", "compiler", "ai-agents", "verification"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Compilers",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/ExposingTheBadge/canon"
Changelog = "https://github.com/ExposingTheBadge/canon/blob/main/CHANGELOG.md"

[project.scripts]
canon = "canon.cli:main"


[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
